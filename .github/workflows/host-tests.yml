name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public-tree hygiene
        run: ./scripts/check-public-tree.sh
      - name: Run playlist, HLS, and H.264 tests
        run: ./tests/run_live_host_tests.sh
